# Day 20 §5 — the golden dataset (the five-field, hash-pinned, pre-registered set).
#
# This file is the *commitment*: expected evidence, expected answer, expected
# tools and failure category are written HERE, before any run, and the harness
# refuses to grade under a stale `dataset_hash` (V1/V8). Patching a row after a
# run came up short is exactly the curve-fit pre-registration exists to catch.
#
# Five fields per row (the curriculum's order):
#   question          — the natural-language input, verbatim (from
#                       questions.yaml / code_questions.yaml — cross-checked)
#   expected_evidence — doc_ids / module#Symbols the corpus must surface
#   expected_answer    — {claims: [...minimal facts], must_not_assert: [...]}
#                       NOT a model-voice paragraph; oracle-derivable offline
#   expected_tools     — tools from the Day 11 registry the answer needs
#                       ([] ⇒ a refusal row: no tool should produce an answer)
#   failure_category   — the expected outcome shape: null (answered), "refusal"
#                       (out-of-corpus), or a Day 13 failure_kind
#
# Day 21's added fields (also hash-pinned):
#   relevant_also   — docs known to be *on-topic but not required*, minted from
#                     corpus structure under the same oracle discipline as
#                     expected_evidence, so Precision@K is membership arithmetic
#                     over `expected ∪ relevant_also`. Disjoint from the required
#                     set by construction. Absent ⇒ precision is `n/a` (E-family;
#                     judge-hunting rows — relevance is the trap).
#   human_review    — the corpus-can-be-wrong boundary: every deterministic cell
#                     may pass and the fact must still call the reader. The RAG
#                     bench marks the verdict `PENDING-human` by design (I1).
#   semantic_fail   — a judge-hunting row whose rejection is a *semantic* cell
#                     (Day 21's citation-support), not a deterministic one. Layer 1
#                     correctly passes it — `cited ⊆ retrieved` holds — so the
#                     deterministic harness must not expect layer 1 to reject it;
#                     the RAG bench issues the verdict (K1).
#
# Day 22's added fields (also hash-pinned) — the *agent benchmark*'s call envelope:
#   necessary_calls     — the minimal call set a correct answer must have made,
#                         `[{tool, args?}]`, minted from task structure (never from
#                         a run's output). "Was that call necessary?" becomes
#                         membership in this set: a made call outside it is a U-rule
#                         candidate, and the `undecided` bucket (owned, never
#                         counted) refuses to grade what the trace cannot prove.
#                         A necessary call is required, so it must be listed in
#                         expected_tools (validator-enforced). Free-text `query`/`sql`
#                         is NOT pre-registered — only tool + structured args — so a
#                         correct agent may phrase a search differently (AB3's
#                         `arg_deviation` grades structure, not prose).
#   expected_steps      — `{min, max}`, the tool_steps envelope ([] ⇒ n/a).
#   expected_termination— the loop exit the row expects (default `answer`); an
#                         E-family row still terminates `answer` — *what* it answers
#                         is the refusal, checked separately (AB1).
#
# `predicted`/`fix` ride along from Day 7/10 so a failing row still names its
# owner. `must_not` is the wrong sense that must not be retrieved (Family C).
#
# `kind`:
#   agent          — a row the harness presents to the production loop
#   judge_hunting  — a row built to defeat the *judge* (Rule 3 at the judge
#                    level); graded against the injected `probe`, not a run
#
# `probe` (judge_hunting only) is the hostile answer/evidence the judge must
# reject. It is part of the pre-registration: the failure is deliberate.
#
# Regenerate the hash after any intended edit:
#   python ai_os/eval_dataset.py --pin ai_os/golden.yaml

