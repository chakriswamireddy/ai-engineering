# WS9 — Secrets: Vault (or any External Secrets provider) is the value
# source; the image carries none (docs/deployment.yaml `absent: [.env]`).
# Rotation: refreshInterval 15m re-reads Vault — a rotated credential lands
# without a redeploy. The app reads secrets once at boot from env; rotation
# without restart is explicitly out of scope (documented, not silently stale:
# /readyz names the failing check when a value is missing).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ai-layer-secrets
spec:
  refreshInterval: 15m
  secretStoreRef: {name: vault-backend, kind: ClusterSecretStore}
  target: {name: ai-layer-secrets, creationPolicy: Owner}
  data:
    - {secretKey: OPENAI_API_KEY, remoteRef: {key: ai-layer/openai_api_key}}
    - {secretKey: CLOUDFLARE_API_KEY, remoteRef: {key: ai-layer/cloudflare_api_key}}
    - {secretKey: CLOUDFLARE_ACCOUNT_ID, remoteRef: {key: ai-layer/cloudflare_account_id}}
    - {secretKey: SALEOR_READONLY_DB_URL, remoteRef: {key: ai-layer/saleor_readonly_url}}
    - {secretKey: STATE_ADVISORY_DSN, remoteRef: {key: ai-layer/state_advisory_dsn}}
    - {secretKey: TRACE_SINK_DSN, remoteRef: {key: ai-layer/trace_sink_dsn}}
    - {secretKey: REDIS_URL, remoteRef: {key: ai-layer/redis_url}}
    - {secretKey: OIDC_ISSUER, remoteRef: {key: ai-layer/oidc_issuer}}
    - {secretKey: OIDC_AUDIENCE, remoteRef: {key: ai-layer/oidc_audience}}
